# Local Postgres for development. Production uses RDS; only DATABASE_URL changes.
# Same major version as RDS (shared-db-1 runs 18), so production backups
# restore here and local testing matches the live database.
#   docker compose up -d      start (data survives restarts in the named volume)
#   docker compose down -v    stop and delete all local data
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peyyala
      POSTGRES_PASSWORD: peyyala
      POSTGRES_DB: peyyala
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data in a version folder under this path
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peyyala -d peyyala"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata18:
